# Prometheus / Alertmanager rules (Wave 1 QA_ARCH UNIFIED BACKLOG: A7, A19, A22, B5, H3).
# Apply with: prometheus --config.file=prometheus.yml (add rule_files or use operator).
# Thresholds are starting points — tune per environment (see docs/artifacts/NONFUNCTIONAL_AUDIT_NEXT.md §6).

groups:
  - name: dental_booking_observability
    rules:
      - alert: ERP_VitrineStaleRangeFallback
        expr: |
          sum(rate(erp_aggregate_read_fallback_total{reason="stale_range"}[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "ERP report reads falling back due to stale_range"
          description: "Vitrine max(updated_at) for requested range is older than ERP_AGGREGATE_STALE_MAX_SECONDS."

      - alert: ERP_VitrineEmptyFallback
        expr: |
          sum(rate(erp_aggregate_read_fallback_total{reason="empty_vitrine"}[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "ERP report reads falling back due to empty vitrine"
          description: "No aggregate rows for range; raw fallback used. See A5/A10 backlog for coverage semantics."

      - alert: ERP_NightlyPartialRefresh
        expr: |
          sum(rate(erp_aggregate_nightly_kind_failures_total[1h])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Nightly ERP vitrine refresh failed for at least one clinic/kind"
          description: "Check Celery erp_tasks.refresh_erp_aggregates_nightly logs; metric label aggregate_kind only (clinic_id in structured logs on failure)."

      - alert: HTTPHigh5xxRate
        expr: |
          sum(rate(http_request_duration_seconds_count{status_class="5xx"}[5m]))
            /
          sum(rate(http_request_duration_seconds_count[5m]))
            > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "HTTP 5xx share above 1% (status_class label)"
          description: "Slice latency histogram by status_class (A22)."

      - alert: BookingToErpChainFailureBurst
        expr: |
          sum(rate(business_chain_booking_erp_errors_total[5m])) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Elevated Booking→ERP/CRM/Loyalty chain errors"
          description: "business_chain_booking_erp_errors_total — check logs by error_type."

      - alert: OmniAiChainFailureBurst
        expr: |
          sum(rate(business_chain_omni_ai_errors_total[5m])) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Elevated Omnichannel+AI chain errors"
          description: "business_chain_omni_ai_errors_total — low-cardinality account_bucket in metrics; tenant detail in logs."

      - alert: CrmLeadActualValueErpMissingFact
        expr: |
          sum(rate(crm_lead_actual_value_erp_missing_fact_total[1h])) > 0
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "CRM lead actual_value refresh saw zero ERP income with completed booking (H3)"
          description: "Investigate CRM vs ERP reconciliation; may be timing or data gap."

      - alert: ERPVisitRevenueParitySampleMismatch
        expr: |
          increase(erp_aggregate_parity_sample_total{result="mismatch"}[25h]) >= 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Daily visit_revenue parity sample: raw total != vitrine total"
          description: "See structured log erp_parity_sample_visit_revenue_mismatch; run POST refresh or investigate raw bypass. NONFUNCTIONAL_AUDIT_NEXT §5.2."

      - alert: BookingServiceUnavailableBurst
        expr: |
          sum(rate(booking_errors_total{code="service_unavailable"}[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Elevated booking/payment service_unavailable errors (W7 BE4)"
          description: "Slice by source=api|ai_tool and clinic_bucket; correlate logs with trace_id. Dashboard: deploy/grafana/dashboards/dental_booking_booking_errors_w7.json"

      - alert: BookingPaymentFailedBurst
        expr: |
          sum(rate(booking_errors_total{code="payment_failed"}[5m])) > 0.1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Elevated payment_failed from structured booking errors"
          description: "Check YooKassa / gateway; clinic detail in logs, not in metric labels."

      - alert: PaymentWebhookFailures
        expr: |
          sum(rate(payment_webhook_failures_total[15m])) > 0.01
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "YooKassa webhook JSON or processing failures"
          description: "Slice by reason=invalid_json|processing_error; correlate logs with trace_id in response body."
