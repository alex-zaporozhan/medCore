# Phase 5 / WP5.1 — PR quality gate: ruff, tenant ORM audit, mypy (JWT), pip-audit, pytest, gitleaks.
# Complements build-and-test-entitlements.yml (narrow + full suite) with supply-chain and lint checks.
name: Backend CI

on:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "deploy/prometheus/**"
      - "pyproject.toml"
      - "poetry.lock"
      - "alembic/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "deploy/prometheus/**"
      - "pyproject.toml"
      - "poetry.lock"
      - "alembic/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read
  pull-requests: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dental_booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TESTING: "1"
      SECRET_KEY: test-secret-key-ci
      JWT_SECRET_KEY: test-jwt-secret-key-ci
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/dental_booking_test
      DATABASE_URL_TEST: postgresql+asyncpg://postgres:postgres@localhost:5432/dental_booking_test
      REDIS_URL: redis://localhost:6379/0
      RUN_REDIS_INTEGRATION_TESTS: "1"
      PLATFORM_BILLING_WEBHOOK_SECRET: test-platform-billing-webhook-secret
      VK_CLIENT_ID: ci-oauth-vk-client-id
      VK_REDIRECT_URI: https://localhost:5173/api/v1/auth/oauth/vk/callback
      YANDEX_CLIENT_ID: ci-oauth-yandex-client-id
      YANDEX_REDIRECT_URI: https://localhost:5173/api/v1/auth/oauth/yandex/callback

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "1.8.3"
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Ruff
        run: poetry run ruff check src tests

      - name: Tenant ORM audit
        run: poetry run python scripts/audit_tenant_columns.py

      - name: Mypy (JWT module)
        run: poetry run mypy src/core/security.py --ignore-missing-imports --follow-imports=skip

      - name: pip-audit
        run: |
          poetry run pip install pip-audit
          poetry run pip-audit

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build (vite preview for browser E2E)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Playwright (chromium)
        run: poetry run playwright install chromium

      - name: Pytest (full tests + FRONTEND_E2E_URL preview)
        timeout-minutes: 25
        env:
          FRONTEND_E2E_URL: http://127.0.0.1:4173
        run: |
          cd frontend
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/vite-preview.log 2>&1 &
          echo $! > /tmp/vite-preview.pid
          cd ..
          sleep 6
          poetry run pytest tests/ -q --tb=short --maxfail=1

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
