# Push app images to Docker Hub from GitHub Actions (optional).
# Password cannot be typed interactively in Actions — repo secrets DOCKERHUB_USERNAME / DOCKERHUB_TOKEN.
# Triggers: push to main/master (tag: main), git tag v*, or manual workflow_dispatch.
# Recommended for solo VPS: local build + docker login — scripts/docker_hub_release.ps1 or .sh (see CI_CD.md).
# Jenkins → GHCR remains the team pipeline in Jenkinsfile for orgs that use it.
name: Docker Hub publish (optional)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag for backend and frontend images (e.g. main, latest, v1.2.3)"
        required: true
        default: "main"
  push:
    branches:
      - main
      - master
    paths:
      - Dockerfile
      - frontend/Dockerfile
      - pyproject.toml
      - poetry.lock
      - frontend/package.json
      - frontend/package-lock.json
      - .github/workflows/docker-hub-publish.yml
      - "src/**"
      - "frontend/**"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  dockerhub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require Docker Hub secrets
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DH_USER:-}" ] || [ -z "${DH_TOKEN:-}" ]; then
            echo "::error::Set repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN, or push from your PC: scripts/docker_hub_release.ps1 / docker_hub_release.sh"
            exit 1
          fi

      - name: Detect changed paths (branch push only)
        id: path_filter
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'Dockerfile'
              - 'pyproject.toml'
              - 'poetry.lock'
              - 'src/**'
              - 'alembic/**'
              - '.github/workflows/docker-hub-publish.yml'
            frontend:
              - 'frontend/**'

      - name: Set components to build
        id: changes
        env:
          PF_BACKEND: ${{ steps.path_filter.outputs.backend }}
          PF_FRONTEND: ${{ steps.path_filter.outputs.frontend }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]] || [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          B="${PF_BACKEND:-false}"
          F="${PF_FRONTEND:-false}"
          if [[ "${B}" != "true" && "${F}" != "true" ]]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=${B}" >> "$GITHUB_OUTPUT"
            echo "frontend=${F}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve image tag
        id: meta
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/heads/main || "${GITHUB_REF}" == refs/heads/master ]]; then
            echo "tag=main" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.changes.outputs.backend == 'true' || steps.changes.outputs.frontend == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend image (no push)
        if: steps.changes.outputs.backend == 'true'
        run: docker build -t dental-booking-backend:ci -f Dockerfile .

      - name: Build frontend image (no push)
        if: steps.changes.outputs.frontend == 'true'
        run: docker build -t dental-booking-frontend:ci -f Dockerfile ./frontend

      - name: Tag and push backend
        if: steps.changes.outputs.backend == 'true'
        env:
          USER: ${{ secrets.DOCKERHUB_USERNAME }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          docker tag dental-booking-backend:ci "${USER}/dental-booking-backend:${TAG}"
          docker push "${USER}/dental-booking-backend:${TAG}"

      - name: Tag and push frontend
        if: steps.changes.outputs.frontend == 'true'
        env:
          USER: ${{ secrets.DOCKERHUB_USERNAME }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          docker tag dental-booking-frontend:ci "${USER}/dental-booking-frontend:${TAG}"
          docker push "${USER}/dental-booking-frontend:${TAG}"
