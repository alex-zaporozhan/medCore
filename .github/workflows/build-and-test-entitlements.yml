# QA_ARCH: сборка фронта, скрипт wiring entitlements, узкий pytest (Phase 1c) на сервисах Postgres+Redis.
name: Build and test (backend, frontend, entitlements)

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "frontend/**"
      - "scripts/check_admin_entitlement_routers.py"
      - "deploy/prometheus/**"
      - "alembic/**"
      - "pyproject.toml"
      - "poetry.lock"
      - ".github/workflows/build-and-test-entitlements.yml"
  push:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.11"
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/dental_booking_test
  DATABASE_URL_TEST: postgresql+asyncpg://postgres:postgres@localhost:5432/dental_booking_test
  REDIS_URL: redis://localhost:6379/0
  RUN_REDIS_INTEGRATION_TESTS: "1"
  TESTING: "1"
  SECRET_KEY: ci-secret-key-32-chars-minimum-xx
  JWT_SECRET_KEY: ci-jwt-secret-key-32-chars-minimum
  PLATFORM_BILLING_WEBHOOK_SECRET: test-platform-billing-webhook-secret
  # Patient OAuth start routes require non-empty ids + redirect URIs (tests/api/test_auth_oauth.py).
  VK_CLIENT_ID: ci-oauth-vk-client-id
  VK_REDIRECT_URI: https://localhost:5173/api/v1/auth/oauth/vk/callback
  YANDEX_CLIENT_ID: ci-oauth-yandex-client-id
  YANDEX_REDIRECT_URI: https://localhost:5173/api/v1/auth/oauth/yandex/callback
  TELEGRAM_BOT_TOKEN: ci-test-telegram-bot-token

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dental_booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pip install "poetry<3"

      - name: Backend dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Entitlement router wiring (Phase 1c script)
        run: python scripts/check_admin_entitlement_routers.py

      - name: Tenant ORM isolation audit
        run: poetry run python scripts/audit_tenant_columns.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Backend tests (entitlements focus)
        run: |
          poetry run pytest \
            tests/core/test_payment_webhook_governance.py \
            tests/api/test_platform_billing.py \
            tests/application/test_organization_entitlement_access.py \
            tests/api/test_admin_entitlement_api.py \
            tests/api/test_admin_session.py \
            tests/api/test_admin_rbac_box_cuts.py \
            tests/api/test_admin_tasks_rbac.py \
            tests/api/test_phase1e_embed.py \
            tests/api/test_phase3_vertical_import.py \
            tests/api/test_phase4_commerce.py \
            tests/api/test_platform_internal.py \
            tests/api/test_platform_enterprise_leads.py \
            tests/api/test_payments.py \
            tests/api/test_security_soc_metrics.py \
            tests/application/test_domain_outbox_payment.py \
            tests/application/test_domain_outbox_platform_provision.py \
            tests/core/test_security_observability.py \
            tests/core/test_api_error_codes.py \
            tests/core/test_http_exception_envelope.py \
            tests/core/test_openapi_error_schemas.py \
            tests/core/test_grafana_dashboard_json.py \
            tests/deploy/test_prometheus_alert_rules_yaml.py \
            tests/api/test_public_platform_redis_rate_limit.py \
            tests/api/test_public_platform_checkout.py \
            tests/api/test_public_platform_catalog_rate_limit.py \
            tests/api/test_public_commerce_vitrine.py \
            tests/core/test_clinic_read_public_scrub.py \
            -q --tb=short

  full-backend-tests:
    name: Full backend pytest (Phase 2 / U-008)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dental_booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHON_VERSION: "3.11"
      DATABASE_URL_TEST: postgresql+asyncpg://postgres:postgres@localhost:5432/dental_booking_test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/dental_booking_test
      REDIS_URL: redis://localhost:6379/0
      RUN_REDIS_INTEGRATION_TESTS: "1"
      TESTING: "1"
      SECRET_KEY: ci-secret-key-32-chars-minimum-xx
      JWT_SECRET_KEY: ci-jwt-secret-key-32-chars-minimum
      PLATFORM_BILLING_WEBHOOK_SECRET: test-platform-billing-webhook-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        run: pip install "poetry<3"
      - name: Backend dependencies
        run: poetry install --no-interaction --no-ansi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend install and build (E2E / smoke collection)
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Playwright (chromium)
        run: poetry run playwright install chromium
      - name: pytest tests/
        env:
          FRONTEND_E2E_URL: http://127.0.0.1:4173
        run: bash scripts/ci/run_pytest_with_e2e_preview.sh poetry run pytest tests/ -q --tb=short
        timeout-minutes: 30
