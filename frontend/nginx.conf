# Резолвер Docker DNS: резолв upstream при запросе, а не при старте (избегаем "host not found")
resolver 127.0.0.11 valid=10s;
resolver_timeout 5s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite code-splitting: при 404 на .js нельзя отдавать index.html — dynamic import() падает
    # («Failed to fetch dynamically imported module»), а в DevTools видно «успешный» 200 с HTML.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri /index.html;
    }

    # Проксирование API-запросов на backend (FastAPI @ backend:8000)
    location /api/ {
        set $backend_upstream backend:8000;
        proxy_pass         http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

