# Переменные окружения: Docker Compose автоматически загружает .env из директории
# с compose-файлом и подставляет ${VAR} при разборе. Секреты (пароли БД и т.д.)
# задаются только в .env; .env не коммитить (см. .gitignore).
# Контейнеры приложения получают .env через env_file: - .env

services:
  db:
    image: postgres:16-alpine
    container_name: dental_booking_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dental_booking}
    ports:
      - "5442:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: dental_booking_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Одноразовый job: upgrade head, затем контейнер завершается с кодом 0 — это норма (не «павший» сервис).
  migrations:
    image: moircreator/dental-booking-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dental_booking_migrations
    command: sh -c "python -m alembic -c alembic.ini upgrade head && echo alembic_upgrade_ok"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dental_booking}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  backend:
    image: moircreator/dental-booking-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dental_booking_backend
    command: sh -c "exec uvicorn src.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8010:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dental_booking}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    env_file:
      - .env
    depends_on:
      migrations:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx,sys; r=httpx.get('http://localhost:8000/health', timeout=5); sys.exit(0 if r.status_code==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  celery:
    image: moircreator/dental-booking-backend:latest
    container_name: dental_booking_celery
    command: celery -A src.infrastructure.messaging.celery_app worker --loglevel=info
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dental_booking}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    env_file:
      - .env
    depends_on:
      migrations:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    image: moircreator/dental-booking-backend:latest
    container_name: dental_booking_celery_beat
    command: celery -A src.infrastructure.messaging.celery_app beat --loglevel=info
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dental_booking}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    env_file:
      - .env
    depends_on:
      migrations:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: moircreator/dental-booking-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dental_booking_frontend
    ports:
      - "3010:80"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis_data:
