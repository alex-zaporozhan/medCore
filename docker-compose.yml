# Переменные окружения: Docker Compose автоматически загружает .env из директории
# с compose-файлом и подставляет ${VAR} при разборе. Секреты (пароли БД и т.д.)
# задаются только в .env; .env не коммитить (см. .gitignore).
# Контейнеры приложения получают .env через env_file: - .env
#
# Образы приложения (релиз: Jenkins → push в GHCR; Docker Hub не используется):
# - production/staging: фиксируйте digest (GHCR), например:
#   BACKEND_IMAGE=ghcr.io/<GHCR_OWNER>/dental-booking-backend@sha256:<immutable_digest>
#   FRONTEND_IMAGE=ghcr.io/<GHCR_OWNER>/dental-booking-frontend@sha256:<immutable_digest>
# Локальные имена после `docker compose build` без привязки к Hub — в .env:
#   BACKEND_IMAGE=dental-booking-backend:local
#   FRONTEND_IMAGE=dental-booking-frontend:local
#
# Сборка: при ошибках зеркала registry (Beget и т.п.) и странном прокси 127.0.0.1 — проверьте
# Docker Desktop → proxies и daemon.json (registry-mirrors); VPN сам по себе прокси не отключает.
#
# env_file с required: false — Docker Compose v2.24+ (Docker Desktop). Если файла нет, compose не падает.
# Секреты для приложения: скопируйте .env.example → .env или задайте SECRET_KEY / JWT_SECRET_KEY в окружении хоста.

services:
  db:
    image: postgres:16-alpine
    container_name: dental_booking_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dental_booking}
    ports:
      - "5442:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10
      # Первый старт с пустым volume может занять десятки секунд — не считать «unhealthy» раньше времени.
      start_period: 60s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: dental_booking_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # Одноразовый job: upgrade head, затем контейнер завершается с кодом 0 — это норма (не «павший» сервис).
  # Тот же Dockerfile и тег, что у backend (миграции и runtime должны совпадать).
  migrations:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-dental-booking-backend:local}
    container_name: dental_booking_migrations
    command: sh -c "python -m alembic -c alembic.ini upgrade head && echo alembic_upgrade_ok"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dental_booking}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SECRET_KEY: ${SECRET_KEY:-docker-compose-dev-secret-key-change-me-32chars}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-docker-compose-dev-jwt-secret-key-32chars}
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  backend:
    image: ${BACKEND_IMAGE:-dental-booking-backend:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dental_booking_backend
    command: sh -c "exec uvicorn src.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8010:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dental_booking}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SECRET_KEY: ${SECRET_KEY:-docker-compose-dev-secret-key-change-me-32chars}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-docker-compose-dev-jwt-secret-key-32chars}
    env_file:
      - path: .env
        required: false
    volumes:
      # Persist staff feed/chat attachments across container recreate/rebuild.
      - staff_uploads:/app/data/staff_chat_uploads
    depends_on:
      migrations:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx,sys; r=httpx.get('http://localhost:8000/health', timeout=5); sys.exit(0 if r.status_code==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  celery:
    image: ${BACKEND_IMAGE:-dental-booking-backend:local}
    container_name: dental_booking_celery
    command: celery -A src.infrastructure.messaging.celery_app worker --loglevel=info
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dental_booking}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SECRET_KEY: ${SECRET_KEY:-docker-compose-dev-secret-key-change-me-32chars}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-docker-compose-dev-jwt-secret-key-32chars}
    env_file:
      - path: .env
        required: false
    depends_on:
      migrations:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    image: ${BACKEND_IMAGE:-dental-booking-backend:local}
    container_name: dental_booking_celery_beat
    command: celery -A src.infrastructure.messaging.celery_app beat --loglevel=info
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dental_booking}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SECRET_KEY: ${SECRET_KEY:-docker-compose-dev-secret-key-change-me-32chars}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-docker-compose-dev-jwt-secret-key-32chars}
    env_file:
      - path: .env
        required: false
    depends_on:
      migrations:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-dental-booking-frontend:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dental_booking_frontend
    ports:
      - "3010:80"
    env_file:
      - path: ./frontend/.env
        required: false
    depends_on:
      - backend
    restart: unless-stopped

  # Observability stack (Phase 1d): Prometheus scrapes backend /metrics, Alertmanager → HTTP echo (staging proof), Grafana (localhost only).
  # Usage: docker compose --profile observability up -d
  # Grafana: http://127.0.0.1:3001 (admin / $GRAFANA_ADMIN_PASSWORD, default admin). Prometheus: http://127.0.0.1:9090 — bind to loopback only (MP §11 M5).
  prometheus:
    image: prom/prometheus:v2.52.0
    profiles: ["observability"]
    container_name: dental_booking_prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/dental_booking_alerts.yml:/etc/prometheus/rules/dental_booking_alerts.yml:ro
    depends_on:
      backend:
        condition: service_healthy
      alertmanager:
        condition: service_started
    restart: unless-stopped

  alertmanager-webhook-echo:
    image: mendhak/http-https-echo:35
    profiles: ["observability"]
    container_name: dental_booking_alertmanager_echo
    ports:
      - "127.0.0.1:8888:8080"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: ["observability"]
    container_name: dental_booking_alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    depends_on:
      - alertmanager-webhook-echo
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["observability"]
    container_name: dental_booking_grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_HTTP_PORT: "3000"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  # Playwright E2E (headless) against running compose stack.
  # Usage: docker compose up -d db redis migrations backend frontend
  #        docker compose --profile e2e run --rm e2e
  e2e:
    image: mcr.microsoft.com/playwright:v1.49.1-jammy
    container_name: dental_booking_e2e
    profiles: ["e2e"]
    working_dir: /work/frontend
    environment:
      CI: "1"
      BASE_URL: http://frontend
      E2E_EXTERNAL_BASE_URL: http://frontend
    volumes:
      - ./frontend:/work/frontend
    depends_on:
      - frontend
    entrypoint: ["/bin/bash", "-lc"]
    command: "npm ci && npx playwright test"
    restart: "no"

volumes:
  redis_data:
  staff_uploads:
