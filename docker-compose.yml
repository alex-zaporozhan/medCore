# Переменные окружения: Docker Compose автоматически загружает .env из директории
# с compose-файлом и подставляет ${VAR} при разборе. Секреты (пароли БД и т.д.)
# задаются только в .env; .env не коммитить (см. .gitignore).
# Контейнеры приложения получают .env через env_file: - .env
#
# Образы приложения:
# - production/staging: фиксируйте digest (GHCR), например:
#   BACKEND_IMAGE=ghcr.io/<GHCR_OWNER>/dental-booking-backend@sha256:<immutable_digest>
#   FRONTEND_IMAGE=ghcr.io/<GHCR_OWNER>/dental-booking-frontend@sha256:<immutable_digest>
# Локальные имена после `docker compose build` без привязки к Hub — в .env:
#   BACKEND_IMAGE=dental-booking-backend:local
#   FRONTEND_IMAGE=dental-booking-frontend:local
#
# Сборка: ошибка dockerhub1.beget.com + 127.0.0.1:12334 — см. docs/DOCKER_INFRA_PASSPORT.md §6.1
# (прокси в Docker Desktop и/или registry-mirrors; отключение VPN это не сбрасывает).
#
# env_file с required: false — Docker Compose v2.24+ (Docker Desktop). Если файла нет, compose не падает.
# Секреты для приложения: скопируйте .env.example → .env или задайте SECRET_KEY / JWT_SECRET_KEY в окружении хоста.

services:
  db:
    image: postgres:16-alpine
    container_name: dental_booking_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dental_booking}
    ports:
      - "5442:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10
      # Первый старт с пустым volume может занять десятки секунд — не считать «unhealthy» раньше времени.
      start_period: 60s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: dental_booking_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # Одноразовый job: upgrade head, затем контейнер завершается с кодом 0 — это норма (не «павший» сервис).
  # Тот же Dockerfile и тег, что у backend (миграции и runtime должны совпадать).
  migrations:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-dental-booking-backend:local}
    container_name: dental_booking_migrations
    command: sh -c "python -m alembic -c alembic.ini upgrade head && echo alembic_upgrade_ok"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dental_booking}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SECRET_KEY: ${SECRET_KEY:-docker-compose-dev-secret-key-change-me-32chars}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-docker-compose-dev-jwt-secret-key-32chars}
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  backend:
    image: ${BACKEND_IMAGE:-dental-booking-backend:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dental_booking_backend
    command: sh -c "exec uvicorn src.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8010:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dental_booking}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SECRET_KEY: ${SECRET_KEY:-docker-compose-dev-secret-key-change-me-32chars}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-docker-compose-dev-jwt-secret-key-32chars}
    env_file:
      - path: .env
        required: false
    volumes:
      # Persist staff feed/chat attachments across container recreate/rebuild.
      - staff_uploads:/app/data/staff_chat_uploads
    depends_on:
      migrations:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx,sys; r=httpx.get('http://localhost:8000/health', timeout=5); sys.exit(0 if r.status_code==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  celery:
    image: ${BACKEND_IMAGE:-dental-booking-backend:local}
    container_name: dental_booking_celery
    command: celery -A src.infrastructure.messaging.celery_app worker --loglevel=info
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dental_booking}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SECRET_KEY: ${SECRET_KEY:-docker-compose-dev-secret-key-change-me-32chars}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-docker-compose-dev-jwt-secret-key-32chars}
    env_file:
      - path: .env
        required: false
    depends_on:
      migrations:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    image: ${BACKEND_IMAGE:-dental-booking-backend:local}
    container_name: dental_booking_celery_beat
    command: celery -A src.infrastructure.messaging.celery_app beat --loglevel=info
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dental_booking}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SECRET_KEY: ${SECRET_KEY:-docker-compose-dev-secret-key-change-me-32chars}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-docker-compose-dev-jwt-secret-key-32chars}
    env_file:
      - path: .env
        required: false
    depends_on:
      migrations:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-dental-booking-frontend:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dental_booking_frontend
    ports:
      - "3010:80"
    env_file:
      - path: ./frontend/.env
        required: false
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis_data:
  staff_uploads:
