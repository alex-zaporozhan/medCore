[tool.poetry]
name = "dental-booking"
version = "0.1.0"
description = "MVP системы записи клиентов в стоматологии"
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
sqlalchemy = "^2.0.25"
asyncpg = "^0.29.0"
alembic = "^1.13.1"
pydantic = "^2.5.3"
pydantic-settings = "^2.1.0"
email-validator = "^2.1.0"
redis = "^5.0.1"
aioredis = "^2.0.1"
celery = {extras = ["redis"], version = "^5.3.4"}
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.6"
httpx = "^0.26.0"
python-telegram-bot = "^20.7"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.24.0"
pytest-playwright = "^0.4.3"
black = "^24.1.1"
ruff = "^0.1.11"
mypy = "^1.8.0"

[tool.pip-audit]
require-hashes = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "regression_payments: regression tests for payments and payment gateway",
    "regression_pd: regression tests for personal data isolation and access",
    "regression_chats: regression tests for chats and omnichannel",
    "security: security-focused tests (kassa, PD, chats)",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
