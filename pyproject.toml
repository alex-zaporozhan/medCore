[tool.poetry]
name = "dental-booking"
version = "0.1.0"
description = "MVP системы записи клиентов в стоматологии"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.135.0"
starlette = "^0.49.1"
uvicorn = {version = "^0.34.0", extras = ["standard"]}
sqlalchemy = "^2.0.25"
asyncpg = "^0.29.0"
alembic = "^1.13.1"
pydantic = "^2.9.0"
pydantic-settings = "^2.1.0"
email-validator = "^2.1.0"
redis = "^5.0.1"
aioredis = "^2.0.1"
celery = {extras = ["redis"], version = "^5.3.4"}
cryptography = "^46.0.7"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.26"
httpx = "^0.26.0"
requests = "^2.33.0"
prometheus-client = "^0.21.0"
python-telegram-bot = "^20.7"
pyjwt = "^2.12.0"
pyasn1 = "^0.6.3"
boto3 = "^1.42.79"
pyotp = "^2.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pygments = "^2.20.0"
pytest-asyncio = "^1.3.0"
pytest-playwright = "^0.7.0"
black = "^26.3.0"
ruff = "^0.9.0"
mypy = "^1.8.0"
pytest-timeout = ">=2.3.1"

[tool.pip-audit]
require-hashes = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
# QA_ARCH: fail fast on hung tests (infinite SSE, deadlocks, blocked I/O) instead of waiting indefinitely.
# Fixtures are excluded so session init_db/seed_data/truncate are not cut mid-run.
# Per-test cap (pytest-timeout). Windows + asyncio uses thread timeout; slow DB/IO may need headroom.
timeout = 240
timeout_func_only = true
markers = [
    "critical_path: LEAD A3 — signup/provision/webhooks/founder; CI gate requires skip=0",
    "regression_payments: regression tests for payments and payment gateway",
    "regression_pd: regression tests for personal data isolation and access",
    "regression_chats: regression tests for chats and omnichannel",
    "security: security-focused tests (kassa, PD, chats, tenant isolation)",
    "redis_integration: tests requiring real Redis; enable with RUN_REDIS_INTEGRATION_TESTS=1 (10-Q8)",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
